# @package _global_
defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - _self_

habitat:
  seed: 100
  environment:
    max_episode_steps: 401
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: false
  simulator:
    agents:
      main_agent:
        height: 1.5
        radius: 0.1
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 90
            position: [0.0, 1.25, 0.0]
          depth_sensor:
            width: 400
            height: 400
            hfov: 120
            position: [0.0, 1.25, 0.0]
            normalize_depth: false
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: true
      enable_physics: false
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
  dataset:
    type: RxRVLN-v1
    split: val_unseen
    scenes_dir: data/scene_datasets/
    data_path: data/datasets/rxr/{split}/{split}_guide.json.gz
